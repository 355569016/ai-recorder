window.onerror = function(message, source, lineno, colno, error) {
  var target = document.getElementById("phone");
  if (target) {
    target.innerHTML = "<div style=\"padding:24px;font-family:sans-serif\"><h2>浏览器端脚本错误</h2><p>" + String(message) + "</p><p>" + lineno + ":" + colno + "</p></div>";
  }
  var spec = document.getElementById("specBody");
  if (spec) {
    spec.textContent = error && error.stack ? error.stack : String(message);
  }
};

function clearFirmwareUpdateTimer() {
  if (!firmwareUpdateTimer) return;
  window.clearTimeout(firmwareUpdateTimer);
  firmwareUpdateTimer = null;
}

function scheduleFirmwareUpdateStep(callback, delay = 3000) {
  clearFirmwareUpdateTimer();
  firmwareUpdateTimer = window.setTimeout(() => {
    firmwareUpdateTimer = null;
    if (currentPageId !== "APP-DEV-08") return;
    callback();
  }, delay);
}

function beginFirmwareTransfer() {
  firmwareUpdateStep = "transfer";
  firmwareJoinPromptOpen = false;
  render();
  scheduleFirmwareUpdateStep(() => {
    if (firmwareUpdateStep !== "transfer") return;
    firmwareUpdateStep = "install";
    render();
  });
}

function beginFirmwareUpdateFlow() {
  clearFirmwareUpdateTimer();
  firmwareUpdateStep = "download";
  firmwareJoinPromptOpen = false;
  scheduleFirmwareUpdateStep(() => {
    if (firmwareUpdateStep !== "download") return;
    firmwareUpdateStep = "connect";
    if (firmwareUpdateTransport === "wifi") {
      firmwareJoinPromptOpen = true;
      render();
      return;
    }
    render();
    scheduleFirmwareUpdateStep(() => {
      if (firmwareUpdateStep !== "connect") return;
      beginFirmwareTransfer();
    });
  });
}

function resumeFirmwareUpdateAtConnection() {
  clearFirmwareUpdateTimer();
  firmwareUpdateStep = "connect";
  firmwareJoinPromptOpen = firmwareUpdateTransport === "wifi";
  if (firmwareUpdateTransport === "bluetooth") {
    scheduleFirmwareUpdateStep(() => {
      if (firmwareUpdateStep !== "connect") return;
      beginFirmwareTransfer();
    });
  }
}

function fileCard(file) {
  const disabled = file.transferState === "syncing" || file.transferState === "pending";
  const statusNode = disabled
    ? file.transferState === "pending" && file.taskId
      ? `<div class="file-transfer-status-wrap">
          <button class="file-transfer-status file-transfer-status-action ${file.isPriority ? "prioritized" : ""}" data-action="open-home-priority-menu" data-task-id="${h(file.taskId)}" aria-haspopup="dialog" aria-expanded="${homePriorityMenuTaskId === file.taskId ? "true" : "false"}" aria-label="${h(file.name)}，${file.isPriority ? "已优先" : "等待传输"}，点击查看传输顺序操作">
            <span role="status" aria-live="polite">${h(file.isPriority ? "已优先" : file.statusText)}</span>
          </button>
          ${homePriorityMenuTaskId === file.taskId ? renderHomePriorityPopover(file.taskId) : ""}
        </div>`
      : `<div class="file-transfer-status"><span role="status" aria-live="polite">${h(file.statusText)}</span>${file.transferState === "syncing" ? '<em class="sync-state-spinner file-transfer-spinner" aria-hidden="true"></em>' : ""}</div>`
    : file.errorText
      ? `<button class="file-card-recovery" ${file.actionKey ? `data-action="${h(file.actionKey)}"` : `data-go="${file.go}"`} aria-label="${h(file.errorText)}，${h(file.action)}"><span>${h(file.errorText)}</span><b aria-hidden="true">·</b><strong>${h(file.action)}</strong></button>`
      : "";
  const content = `
    <div>
      <p class="file-name">${h(file.name)}</p>
      <div class="file-meta">${h(file.meta)}</div>
      <div class="file-tags">${chip(file.source, file.source === "硬件录音" ? "blue" : "purple")}${file.state ? chip(file.state, file.tone) : ""}</div>
    </div>
  `;
  return `
    <div class="file-card ${file.featured ? "featured" : ""} ${disabled ? `file-card-transfer-disabled ${file.transferState}` : ""} ${file.errorText ? "file-card-has-recovery" : ""}"${file.transferState === "syncing" ? ' aria-disabled="true"' : ""}>
      ${disabled || file.errorText ? `${content}${statusNode}` : `<button class="file-card-main" data-go="${h(file.go)}" aria-label="打开${h(file.name)}详情">${content}</button>`}
    </div>
  `;
}

function renderHomePriorityPopover(taskId) {
  const task = homeSyncQueue.find((item) => item.id === taskId && item.status === "pending");
  if (!task) return "";
  const pendingTasks = homeSyncQueue.filter((item) => item.status === "pending");
  const pendingIndex = pendingTasks.findIndex((item) => item.id === taskId);
  const isNext = pendingIndex === 0;
  const filesAhead = Math.max(1, pendingIndex + (homeSyncQueue.some((item) => item.status === "syncing") ? 1 : 0));
  const estimatedMinutes = Math.max(1, filesAhead * (homeSyncTransport === "hotspot" ? 1 : 2));
  return `
    <section class="file-priority-popover" role="dialog" aria-label="调整传输顺序">
      <strong>${isNext ? "当前已是下一项" : `前面还有 ${filesAhead} 个文件`}</strong>
      <span>${isNext ? "当前文件完成后将自动传输" : `预计约 ${estimatedMinutes} 分钟后开始`}</span>
      ${isNext ? "" : `<button data-action="confirm-home-priority" data-task-id="${h(taskId)}">设为优先同步</button>`}
    </section>
  `;
}

function setHomePriorityTask(taskId) {
  const taskIndex = homeSyncQueue.findIndex((item) => item.id === taskId && item.status === "pending");
  if (taskIndex < 0) return false;
  const pendingTasks = homeSyncQueue.filter((item) => item.status === "pending");
  if (pendingTasks[0]?.id === taskId) return false;
  const [task] = homeSyncQueue.splice(taskIndex, 1);
  homeSyncQueue.forEach((item) => {
    item.priority = false;
  });
  task.priority = true;
  const activeIndex = homeSyncQueue.findIndex((item) => item.status === "syncing");
  const insertIndex = activeIndex >= 0 ? activeIndex + 1 : homeSyncQueue.findIndex((item) => item.status === "pending");
  homeSyncQueue.splice(insertIndex >= 0 ? insertIndex : homeSyncQueue.length, 0, task);
  closeHomePriorityMenu();
  homePriorityNotice = "已设为优先，将在当前文件后传输";
  if (homePriorityNoticeTimer) window.clearTimeout(homePriorityNoticeTimer);
  homePriorityNoticeTimer = window.setTimeout(() => {
    homePriorityNoticeTimer = null;
    homePriorityNotice = "";
    if (currentPageId === "APP-HOME-01") render();
  }, 1800);
  return true;
}

function homeSyncStats() {
  const total = homeSyncQueue.length;
  const completed = homeSyncQueue.filter((task) => task.status === "completed").length;
  const totalBytes = homeSyncQueue.reduce((sum, task) => sum + task.size, 0);
  const transferredBytes = homeSyncQueue.reduce((sum, task) => sum + Math.min(task.transferred, task.size), 0);
  const percent = totalBytes ? Math.round((transferredBytes / totalBytes) * 100) : 0;
  const remainingBytes = Math.max(0, totalBytes - transferredBytes);
  const speed = homeSyncTransport === "hotspot" ? 2 : .45;
  const remainingMinutes = Math.max(1, Math.ceil((remainingBytes / speed) / 60));
  return { total, completed, totalBytes, transferredBytes, percent, remainingBytes, remainingMinutes };
}

function homeSyncTaskPercent(task) {
  return task.size ? Math.round((Math.min(task.transferred, task.size) / task.size) * 100) : 0;
}

function shouldShowHomeSyncStatus() {
  if (homeSyncStage !== "finishing" || !homeSyncQueue.length) return false;
  const stats = homeSyncStats();
  const unfinishedTaskCount = homeSyncQueue.filter((task) => task.status !== "completed").length;
  return !(unfinishedTaskCount < 2 && stats.remainingMinutes < 3);
}

function renderHomeSyncModule(stage = homeSyncStage) {
  const transportViews = {
    ble: { label: "蓝牙", tone: "ble" },
    hotspot: { label: "录音卡热点", tone: "hotspot" }
  };
  if (stage !== homeSyncStage || !shouldShowHomeSyncStatus()) return "";
  const stats = homeSyncStats();
  const multipleTasks = stats.total > 1;
  const transport = transportViews[homeSyncTransport] || transportViews.ble;
  const title = "同步中";
  const remainingText = `预计 ${stats.remainingMinutes} 分钟`;
  return `
    <section class="sync-mini finishing ${homeSyncTransport === "hotspot" ? "hotspot-active" : ""}" aria-label="当前同步状态">
      <div class="sync-mini-main" aria-label="本次同步进度">
        <strong>${h(title)}</strong>
        <i class="sync-transport-badge ${transport.tone}">${h(transport.label)}</i>
        <b>${stats.percent}%</b>
        ${multipleTasks ? `<em class="sync-mini-count">${stats.completed}/${stats.total}</em>` : ""}
        <span>${h(remainingText)}</span>
      </div>
      ${homeSyncTransport === "hotspot" ? "" : `<button class="sync-mini-switch" data-go="APP-SYNC-01">快传</button>`}
      <div class="sync-mini-progress" aria-hidden="true"><b style="width:${stats.percent}%"></b></div>
    </section>
  `;
}

function completeCurrentHomeSyncTask() {
  const activeTask = homeSyncQueue.find((task) => task.status === "syncing");
  if (!activeTask) return;
  activeTask.status = "completed";
  activeTask.transferred = activeTask.size;
  const nextTask = homeSyncQueue.find((task) => task.status === "pending");
  if (nextTask) {
    nextTask.status = "syncing";
    nextTask.priority = false;
    homeSyncStage = "finishing";
  } else {
    homeSyncStage = "saved";
  }
}

function nextRecordingMarkTime() {
  const offset = Math.max(0, recordingMarks.length - recordingBaseMarks.length);
  const totalSeconds = (30 * 60) + 51 + (offset * 13);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `00:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

function nextRecordingMarkId() {
  recordingMarkSerial += 1;
  return `recording-mark-${recordingMarkSerial}`;
}

function showRecordingNotice(message) {
  recordingNotice = message;
  if (recordingNoticeTimer) window.clearTimeout(recordingNoticeTimer);
  recordingNoticeTimer = window.setTimeout(() => {
    recordingNoticeTimer = null;
    recordingNotice = "";
    if (currentPageId === "APP-REC-04") render();
  }, 1600);
}

function openRecordingEditor(mode, markId = "") {
  const mark = recordingMarks.find((item) => item.id === markId);
  const draft = mode === "new-input"
    ? ""
    : mode === "photo-caption"
      ? mark?.caption || ""
      : mark?.text || "";
  recordingEditor = {
    mode,
    markId,
    draft,
    time: mark?.time || nextRecordingMarkTime()
  };
  recordingCameraPrompt = false;
}

function closeRecordingEditor() {
  recordingEditor = null;
}

function completeRecordingEditor() {
  if (!recordingEditor) return false;
  const draft = String(recordingEditor.draft || "").trim();
  if (recordingEditor.mode !== "photo-caption" && !draft) {
    showRecordingNotice("请输入标记内容");
    return false;
  }
  if (recordingEditor.mode === "new-input") {
    recordingMarks = [
      ...recordingMarks,
      { id: nextRecordingMarkId(), time: recordingEditor.time, type: "input", text: draft, source: "APP" }
    ];
    showRecordingNotice("已添加输入标记");
  } else if (recordingEditor.mode === "photo-caption") {
    recordingMarks = recordingMarks.map((mark) => mark.id === recordingEditor.markId
      ? { ...mark, caption: draft, captionSource: draft ? "user" : "" }
      : mark);
    showRecordingNotice(draft ? "照片说明已保存" : "照片说明已清空");
  } else {
    recordingMarks = recordingMarks.map((mark) => mark.id === recordingEditor.markId
      ? { ...mark, text: draft }
      : mark);
    showRecordingNotice("标记内容已保存");
  }
  closeRecordingEditor();
  return true;
}

function addRecordingMark(type) {
  if (type === "input") {
    openRecordingEditor("new-input");
    return;
  }
  if (type === "photo") {
    recordingCameraOpen = true;
    recordingCameraPrompt = false;
    return;
  }
  recordingMarks = [
    ...recordingMarks,
    { id: nextRecordingMarkId(), time: nextRecordingMarkTime(), type: "mark", text: "重点标记", source: "APP" }
  ];
  showRecordingNotice("已添加时间标记");
}

}

function fileDetailTimeToSeconds(time) {
  return String(time || "00:00:00").split(":").reduce((total, part) => total * 60 + Number(part || 0), 0);
}

function fileDetailSecondsToTime(totalSeconds) {
  const seconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  return [hours, minutes, rest].map((part) => String(part).padStart(2, "0")).join(":");
}

  }, 1800);
}

function renderFileDetailPlayer(totalTime = "00:43:52") {

function persistFileDetailMarkerEdit(showNotice = false) {
  if (!fileDetailMarkerEditor) return;
  const draft = fileDetailMarkerEditor.draft.trim();
  recordingMarks = recordingMarks.map((mark) => {
    if (mark.id !== fileDetailMarkerEditor.markId) return mark;
    return mark.type === "photo"
      ? { ...mark, caption: draft, captionSource: draft ? "user" : "" }
      : { ...mark, text: draft };
  });
  fileDetailMarkerEditor = null;
  if (showNotice) showFileDetailNotice(draft ? "标记已自动保存" : "标记文字已清空，时间锚点已保留");
}

function persistFileDetailContentEdit(showNotice = false) {
  if (!fileDetailContentEditor) return;
  const draft = fileDetailContentEditor.draft.trim();
  if (draft) {
    if (fileDetailContentEditor.kind === "summary") fileDetailContent.summary = draft;
    if (fileDetailContentEditor.kind === "transcript") {
      const index = Number(fileDetailContentEditor.key.split("-")[1]);
      fileDetailContent.transcript[index] = draft;
    }
  }
  fileDetailContentEditor = null;
  if (showNotice && draft) showFileDetailNotice("内容已自动保存");
}

function defaultFileDetailFormatState() {

    indent: 0,
    quote: false
  };
}

function storeFileDetailFormatState() {
  if (!fileDetailContentEditor?.key) return;
  fileDetailContentFormats[fileDetailContentEditor.key] = { ...fileDetailFormatState };
}

function pushFileDetailEditHistory(value) {
  if (!fileDetailContentEditor || fileDetailEditHistory.at(-1) === value) return;
  fileDetailEditHistory.push(value);
  if (fileDetailEditHistory.length > 40) fileDetailEditHistory.shift();
  fileDetailEditRedo = [];
}

function applyFileDetailFormatState() {
  const input = activeFileDetailInput();
  if (!input || !fileDetailContentEditor) return;
  ["body", "h1", "h2", "h3", "h4"].forEach((value) => input.classList.toggle(`is-${value}`, fileDetailFormatState.block === value));
  input.classList.toggle("is-bold", fileDetailFormatState.bold);
  input.classList.toggle("is-italic", fileDetailFormatState.italic);
  input.classList.toggle("is-underline", fileDetailFormatState.underline);
  input.classList.toggle("is-strike", fileDetailFormatState.strike);
  input.classList.toggle("is-code", fileDetailFormatState.code);
  input.classList.toggle("is-list", fileDetailFormatState.list !== "none");
  input.classList.toggle("is-quote", fileDetailFormatState.quote);
  input.dataset.list = fileDetailFormatState.list;
  input.dataset.indent = String(fileDetailFormatState.indent);
}

function focusFileDetailEditor(inputId) {
  requestAnimationFrame(() => {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.style.height = "auto";
    input.style.height = `${input.scrollHeight}px`;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    applyFileDetailFormatState();
  });
}

function localDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function recordingMinutesForDate(date, index) {
  const seed = (date.getFullYear() * 17 + (date.getMonth() + 1) * 31 + date.getDate() * 13 + index) % 29;
  if (seed < 16) return 0;
  if (seed < 21) return 8 + (seed * 3) % 18;
  if (seed < 26) return 31 + (seed * 7) % 54;
  return 96 + (seed * 11) % 88;
}

function heatmapDots() {
  const daysPerWeek = 7;
  const weekCount = 53;
  const totalDays = daysPerWeek * weekCount;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const start = new Date(today);
  start.setDate(today.getDate() - totalDays + 1);
  const cells = [];

  for (let index = 0; index < totalDays; index += 1) {
    const date = new Date(start);
    date.setDate(start.getDate() + index);
    const dateKey = localDateKey(date);
    const minutes = recordingMinutesForDate(date, index);
    const level = minutes === 0 ? 0 : Math.min(4, Math.ceil(minutes / 45));
    const label = `${dateKey} · 录音卡实际录音 ${minutes} 分钟`;
    cells.push(`<i class="level-${level}" role="gridcell" aria-rowindex="${index % daysPerWeek + 1}" aria-colindex="${Math.floor(index / daysPerWeek) + 1}" aria-label="${label}" title="${label}" data-date="${dateKey}" data-recording-minutes="${minutes}"></i>`);
  }

  const monthSpans = [];
  let lastMonth = -1;
  const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
  for (let w = 0; w < weekCount; w += 1) {
    const day = new Date(start);
    day.setDate(start.getDate() + w * daysPerWeek);
    const m = day.getMonth();
    if (m !== lastMonth) {
      monthSpans.push(`<span style="grid-column: ${w + 1} / span 4;">${monthNames[m]}</span>`);
      lastMonth = m;
    }
  }

  return `
    <section class="settings-week-heatmap" aria-label="录音卡实际录音使用热力图">
      <div class="settings-week-heatmap-scroll" data-visible-days="180" tabindex="0" aria-label="录音使用热力图，可横向滚动查看更早日期">
        <div class="settings-week-heatmap-container" style="--settings-week-count:${weekCount}">
          <div class="settings-week-heatmap-grid" role="grid" aria-rowcount="7" aria-colcount="${weekCount}">${cells.join("")}</div>
          <div class="settings-week-heatmap-months" aria-hidden="true">${monthSpans.join("")}</div>
        </div>
      </div>
    </section>
  `;
}

function termGroupLabel(term) {
  const first = String(term || "").trim().charAt(0);
  return /^[A-Za-z]$/.test(first) ? first.toUpperCase() : "#";

function renderTermRows() {
  const groups = customTerms.reduce((acc, term, index) => {
    const key = termGroupLabel(term);
    if (!acc[key]) acc[key] = [];
    acc[key].push([term, index]);
    return acc;
  }, {});
  return Object.keys(groups).sort().map((key) => `
    <section class="terms-alpha-group">
      <h2>${h(key)}</h2>
      ${groups[key].map(([term, index]) => `
        <button class="terms-list-row" data-action="open-edit-term" data-term-index="${index}">
          <span>${h(term)}</span>
          <i>›</i>
        </button>
      `).join("")}
    </section>
  `).join("");
}

function handleSettingsAction(action, target) {
  if (action === "toggle-readability") {
    settingsState.improveReadability = !settingsState.improveReadability;
    render();
    return true;
  }
  if (action === "dismiss-settings-notice") {
    settingsNotice = "";
    render();
    return true;
  }
  if (action === "confirm-readability") {
    settingsState.improveReadability = true;
    settingsNotice = "";
    render();
    return true;
  }
  if (action === "toggle-improve-ai") {
    settingsState.improveAi = !settingsState.improveAi;
    render();
    return true;
  }
  if (action === "select-language") {
    settingsState.transcriptionLanguage = target.dataset.value;
    go("APP-ME-26");
    return true;
  }
  if (action === "toggle-speaker-diarization") {
    settingsState.speakerDiarization = !settingsState.speakerDiarization;
    render();
    return true;
  }
  if (action === "choose-speaker-name") {
    settingsState.speakerName = target.dataset.value || "我（用户名称）";
    render();
    return true;
  }
  if (action === "continue-speaker-name") {
    const value = document.getElementById("speakerNameInput")?.value.trim();
    settingsState.speakerName = value || "我（用户名称）";
    go("APP-ME-31");
    return true;
  }
  if (action === "allow-microphone") {
    settingsState.microphoneAllowed = true;
    settingsState.voiceRecording = false;
    go("APP-ME-32");
    return true;
  }
  if (action === "toggle-voice-recording") {
    if (!settingsState.voiceRecording) {
      settingsState.voiceRecording = true;
      render();
    } else {
      settingsState.voiceRecording = false;
      settingsState.voiceSampleCreated = true;
      go("APP-ME-33");
    }
    return true;
  }
  if (action === "toggle-custom-terms") {
    if (settingsState.customTermsEnabled) {
      settingsState.customTermsEnabled = false;
    } else if (!settingsState.industry && customTerms.length === 0) {
      pendingTermsEnableNotice = true;
    } else {
      settingsState.customTermsEnabled = true;
    }
    render();
    return true;
  }
  if (action === "dismiss-terms-enable-notice") {
    pendingTermsEnableNotice = false;
    render();
    return true;
  }
  if (action === "open-term-sheet") {
    termEditorIndex = null;
    termSheetMode = "add";
    termSheetError = "";
    render();
    return true;
  }
  if (action === "open-edit-term") {
    termEditorIndex = Number(target.dataset.termIndex);
    termSheetMode = "edit";
    termSheetError = "";
    render();
    return true;
  }
  if (action === "close-term-sheet") {
    termSheetMode = "";
    termEditorIndex = null;
    termSheetError = "";
    render();
    return true;
  }
  if (action === "clear-term-draft") {
    const input = document.getElementById("termSheetInput");
    if (input) {
      input.value = "";
      input.focus();
    }
    termSheetError = "";
    return true;
  }
  if (action === "delete-term-sheet") {
    if (termEditorIndex !== null) customTerms.splice(termEditorIndex, 1);
    termEditorIndex = null;
    termSheetMode = "";
    termSheetError = "";
    if (!settingsState.industry && customTerms.length === 0) settingsState.customTermsEnabled = false;
    render();
    return true;
  }
  if (action === "select-industry") {
    settingsState.industry = target.dataset.value || "";
    if (!settingsState.industry && customTerms.length === 0) settingsState.customTermsEnabled = false;
    pendingTermsEnableNotice = false;
    go("APP-ME-34");
    return true;
  }
  if (action === "save-term-sheet") {
    const value = document.getElementById("termSheetInput")?.value.trim() || "";
    if (!value) {
      termSheetError = "请输入术语";
      render();
      return true;
    }
    if (termSheetMode === "edit" && termEditorIndex !== null) {
      customTerms[termEditorIndex] = value;
    } else {
      if (!customTerms.includes(value)) customTerms.push(value);
    }
    termEditorIndex = null;
    termSheetMode = "";
    termSheetError = "";
    pendingTermsEnableNotice = false;
    render();
    return true;
  }
  if (action === "toggle-notification") {
    const key = target.dataset.notification;
    if (key in settingsState.notifications) settingsState.notifications[key] = !settingsState.notifications[key];
    render();
    return true;
  }
  if (action === "toggle-notifications-allowed") {
    settingsState.notificationsAllowed = !settingsState.notificationsAllowed;
    render();
    return true;
  }
  if (action === "toggle-app-lock") {
    if (settingsState.appLockEnabled) {
      settingsState.appLockEnabled = false;
      render();
    } else {
      go("APP-ME-40");
    }
    return true;
  }
  if (action === "select-auto-lock-inline") {
    settingsState.autoLockDuration = target.dataset.value;
    render();
    return true;
  }
  if (action === "allow-face-id") {
    settingsState.faceIdAllowed = true;
    settingsState.appLockEnabled = true;
    go("APP-ME-38");
    return true;
  }
  if (action === "select-auto-lock") {
    settingsState.autoLockDuration = target.dataset.value;
    go("APP-ME-38");
    return true;
  }
  return false;
}

    });

  renderNav();

  renderPrototypeLinks(page);
  renderSpec(page);
}

document.addEventListener("click", (event) => {
  const askInput = event.target.closest(".note-question-bar");
  if (askInput) {
    askPlaudMode = "intro";
    render();
    return;
  }
  const tab = event.target.closest("[data-tab]");
  if (tab) {
    fileDetailTab = tab.dataset.tab;
    render();
    return;
  }
  const mode = event.target.closest("[data-mode]");
  if (mode) {
    generationMode = mode.dataset.mode;
    render();
    return;
  }
  const action = event.target.closest("[data-action]");
  if (action && action.dataset.action === "toggle-register-password") {
    registerPasswordVisible = !registerPasswordVisible;
    render();
    requestAnimationFrame(() => document.getElementById("registerPassword")?.focus());
    return;
  }
  if (action && action.dataset.action === "toggle-register-agreement") {
    registerAgreementAccepted = !registerAgreementAccepted;
    if (registerNoticeTone === "error") {
      registerNotice = "";
      registerNoticeTone = "";
    }
    render();
    return;
  }
  if (action && action.dataset.action === "toggle-register-marketing") {
    registerMarketingOptIn = !registerMarketingOptIn;
    render();
    return;
  }
  if (action && action.dataset.action === "submit-register") {
    registerEmail = document.getElementById("registerEmail")?.value.trim().toLowerCase() || "";
    registerPassword = document.getElementById("registerPassword")?.value || "";
    if (!isValidEmail(registerEmail)) {
      registerNotice = "请输入有效的邮箱地址。";
      registerNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("registerEmail")?.focus());
      return;
    }
    if (registerPassword.length < 8) {
      registerNotice = "密码至少需要 8 位。";
      registerNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("registerPassword")?.focus());
      return;
    }
    if (!registerAgreementAccepted) {
      registerNotice = "请先同意用户协议和隐私政策。";
      registerNoticeTone = "error";
      render();
      return;
    }
    registerNotice = "";
    registerNoticeTone = "";
    registerCode = "";
    registerCodeNotice = "";
    registerCodeNoticeTone = "";
    startRegisterCodeCountdown();
    go("APP-ONB-03");
    requestAnimationFrame(() => document.querySelector(".register-code-digit")?.focus());
    return;
  }
  if (action && action.dataset.action === "resend-register-code") {
    if (registerCodeCountdown > 0) return;
    registerCode = "";
    registerCodeNotice = "验证码已重新发送。";
    registerCodeNoticeTone = "success";
    startRegisterCodeCountdown();
    render();
    requestAnimationFrame(() => document.querySelector(".register-code-digit")?.focus());
    return;
  }
  if (action && action.dataset.action === "confirm-register-code") {
    const code = [...document.querySelectorAll(".register-code-digit")].map((input) => input.value).join("");
    registerCode = code;
    if (code.length !== 6) return;
    if (code !== prototypeVerificationCode) {
      registerCodeNotice = "验证码错误，请检查后重新输入。";
      registerCodeNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.querySelector(".register-code-digit")?.focus());
      return;
    }
    registerCodeNotice = "";
    registerCodeNoticeTone = "";
    if (registerCodeTimer) {
      window.clearInterval(registerCodeTimer);
      registerCodeTimer = null;
    }
    registerCodeCountdown = 0;
    go("APP-ONB-04");
    return;
  }
  if (action && action.dataset.action === "send-code-login") {
    codeLoginEmail = document.getElementById("codeLoginEmail")?.value.trim().toLowerCase() || "";
    codeLoginCode = "";
    if (!isValidEmail(codeLoginEmail)) {
      codeLoginCodeSent = false;
      codeLoginNotice = "请输入有效的邮箱地址。";
      codeLoginNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("codeLoginEmail")?.focus());
      return;
    }
    if (!Object.prototype.hasOwnProperty.call(prototypeAccounts, codeLoginEmail)) {
      codeLoginCodeSent = false;
      codeLoginNotice = "该邮箱尚未注册，请先注册账号。";
      codeLoginNoticeTone = "error";
      render();
      return;
    }
    codeLoginCodeSent = true;
    codeLoginNotice = "验证码已发送至该邮箱。";
    codeLoginNoticeTone = "success";
    render();
    requestAnimationFrame(() => document.getElementById("codeLoginCode")?.focus());
    return;
  }
  if (action && action.dataset.action === "login-with-code") {
    codeLoginEmail = document.getElementById("codeLoginEmail")?.value.trim().toLowerCase() || "";
    codeLoginCode = document.getElementById("codeLoginCode")?.value.replace(/\D/g, "").slice(0, 6) || "";
    if (!Object.prototype.hasOwnProperty.call(prototypeAccounts, codeLoginEmail)) {
      codeLoginNotice = "该邮箱尚未注册，请先注册账号。";
      codeLoginNoticeTone = "error";
      render();
      return;
    }
    if (!codeLoginCodeSent) {
      codeLoginNotice = "请先发送验证码。";
      codeLoginNoticeTone = "error";
      render();
      return;
    }
    if (codeLoginCode !== prototypeVerificationCode) {
      codeLoginNotice = "验证码错误，请检查后重新输入。";
      codeLoginNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("codeLoginCode")?.focus());
      return;
    }
    codeLoginNotice = "";
    codeLoginNoticeTone = "";
    go("APP-ONB-04");
    return;
  }
  if (action && action.dataset.action === "toggle-change-password-visibility") {
    const fieldKey = action.dataset.passwordField;
    if (Object.prototype.hasOwnProperty.call(changePasswordVisibility, fieldKey)) {
      changePasswordVisibility[fieldKey] = !changePasswordVisibility[fieldKey];
      render();
      const inputId = {
        current: "changePasswordCurrent",
        new: "changePasswordNew",
        confirm: "changePasswordConfirm"
      }[fieldKey];
      requestAnimationFrame(() => document.getElementById(inputId)?.focus());
    }
    return;
  }
  if (action && action.dataset.action === "submit-change-password") {
    changePasswordCurrent = document.getElementById("changePasswordCurrent")?.value || "";
    changePasswordNew = document.getElementById("changePasswordNew")?.value || "";
    changePasswordConfirm = document.getElementById("changePasswordConfirm")?.value || "";
    if (!changePasswordCurrent || !changePasswordNew || !changePasswordConfirm) return;
    if (changePasswordPrototypeCurrent !== changePasswordCurrent) {
      changePasswordNotice = "当前密码不正确，请重新输入。";
      changePasswordNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("changePasswordCurrent")?.focus());
      return;
    }
    if (changePasswordNew.length < 8) {
      changePasswordNotice = "新密码至少需要 8 位。";

    pendingLogoutDeviceId = action.dataset.deviceId || "";
    render();
    return;
  }
  if (action && action.dataset.action === "cancel-logged-device-logout") {
    pendingLogoutDeviceId = "";
    render();
    return;
  }
  if (action && action.dataset.action === "confirm-logged-device-logout") {
    if (pendingLogoutDeviceId) {
      loggedInDevices = loggedInDevices.filter((device) => device.id !== pendingLogoutDeviceId);
      pendingLogoutDeviceId = "";
      render();
    }
    return;
  }
  if (action && action.dataset.action === "toggle-delete-account-read") {
    deleteAccountReadConfirmed = !deleteAccountReadConfirmed;
    render();
    return;
  }
  if (action && action.dataset.action === "next-delete-account") {
    if (deleteAccountReadConfirmed) {
      deleteAccountStep = "confirm";
      render();
    }
    return;
  }
  if (action && action.dataset.action === "back-delete-account-warning") {
    deleteAccountStep = "warning";
    render();
    return;
  }
  if (action && action.dataset.action === "switch-delete-confirm-mode") {
    deleteAccountConfirmMode = action.dataset.deleteMode || "password";
    deleteAccountConfirmNotice = "";
    deleteAccountConfirmNoticeTone = "";
    render();
    return;
  }
  if (action && action.dataset.action === "send-delete-account-code") {
    deleteAccountConfirmMode = "code";
    deleteAccountCodeSent = true;
    deleteAccountConfirmNotice = "验证码已发送至 mhy_1126@qq.com，请输入 6 位验证码完成身份确认。";
    deleteAccountConfirmNoticeTone = "success";
    render();
    return;
  }
  if (action && action.dataset.action === "confirm-delete-account") {
    if (deleteAccountConfirmMode === "password" && deleteAccountPassword !== prototypeLoginPassword) {
      deleteAccountConfirmNotice = "账号密码错误，请重新输入。";
      deleteAccountConfirmNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("deletePassword")?.focus());
      return;
    }
    if (deleteAccountConfirmMode === "code" && (!deleteAccountCodeSent || deleteAccountCode !== prototypeVerificationCode)) {
      deleteAccountConfirmNotice = deleteAccountCodeSent
        ? "验证码错误，请检查后重新输入。"
        : "请先发送验证码。";
      deleteAccountConfirmNoticeTone = "error";
      render();
      requestAnimationFrame(() => document.getElementById("deleteCode")?.focus());
      return;
    }
    deleteAccountStep = "warning";
    deleteAccountReadConfirmed = false;
    deleteAccountPassword = "";
    deleteAccountCode = "";
    deleteAccountCodeSent = false;
    deleteAccountConfirmNotice = "";
    deleteAccountConfirmNoticeTone = "";
    go("APP-ONB-01");
    return;
  }
  if (action && handleSettingsAction(action.dataset.action, action)) return;
  if (action && action.dataset.action === "toggle-pause") {
    recordPaused = !recordPaused;
    render();
    return;
  }
  const urlLink = event.target.closest("[data-url]");
  if (urlLink) {
    alert("购买页面链接待线上商场渠道补充");
    return;
  }
  const link = event.target.closest("[data-go]");
  if (link) go(link.dataset.go);
});

document.addEventListener("pointerdown", (event) => {
  const editDockButton = event.target.closest(".file-detail-edit-dock button");
  if (editDockButton) {
    fileDetailDockInteraction = true;
    window.setTimeout(() => { fileDetailDockInteraction = false; }, 80);
    event.preventDefault();
    return;
  }
  const priorityTrigger = event.target.closest("[data-action='open-home-priority-menu']");
  if (!priorityTrigger) return;
  clearHomePriorityLongPressTimer();
  const taskId = priorityTrigger.dataset.taskId || "";
  homePriorityLongPressTimer = window.setTimeout(() => {
    homePriorityLongPressTimer = null;
    openHomePriorityMenu(taskId);
  }, 500);
});

["pointerup", "pointercancel", "pointermove"].forEach((eventName) => {
  document.addEventListener(eventName, clearHomePriorityLongPressTimer);
});

document.addEventListener("contextmenu", (event) => {
  const priorityTrigger = event.target.closest("[data-action='open-home-priority-menu']");
  if (!priorityTrigger) return;
  event.preventDefault();
  clearHomePriorityLongPressTimer();
  openHomePriorityMenu(priorityTrigger.dataset.taskId || "");
});

document.addEventListener("keydown", (event) => {
  const priorityTrigger = event.target.closest?.("[data-action='open-home-priority-menu']");
  if (priorityTrigger && ["Enter", " ", "Spacebar"].includes(event.key)) {
    event.preventDefault();
    openHomePriorityMenu(priorityTrigger.dataset.taskId || "", true);
    return;
  }
  if (event.key === "Escape" && currentPageId === "APP-REC-04") {
    if (recordingPhotoViewerId) recordingPhotoViewerId = "";
    else if (recordingCameraOpen) recordingCameraOpen = false;
    else if (recordingEditor) recordingEditor = null;
    else return;
    render();
    return;
  }
    if (event.key === "Escape" && ["APP-FILE-01", "APP-FILE-10", "APP-FILE-15"].includes(currentPageId)) {
    if (fileDetailPhotoViewerId) fileDetailPhotoViewerId = "";
    else if (fileDetailMarkerEditor) persistFileDetailMarkerEdit();
    else if (fileDetailContentEditor) persistFileDetailContentEdit();
    else return;
    render();
    return;
  }
  if (event.key !== "Escape" || !homePriorityMenuTaskId) return;
  const taskId = homePriorityMenuTaskId;
  closeHomePriorityMenu();
  render();
  requestAnimationFrame(() => {
    document.querySelector(`[data-action="open-home-priority-menu"][data-task-id="${taskId}"]`)?.focus();
  });
});

document.addEventListener("input", (event) => {
  if (event.target.id === "fileDetailMarkerInput" && fileDetailMarkerEditor) {
    fileDetailMarkerEditor.draft = event.target.value;
    event.target.style.height = "auto";
    event.target.style.height = `${event.target.scrollHeight}px`;
  }
  if (event.target.id === "fileDetailContentInput" && fileDetailContentEditor) {
    fileDetailContentEditor.draft = event.target.value;
    pushFileDetailEditHistory(event.target.value);
    event.target.style.height = "auto";
    event.target.style.height = `${event.target.scrollHeight}px`;
  }
  if (event.target.id === "recordingEditorInput" && recordingEditor) {
    recordingEditor.draft = event.target.value;
    const completeButton = document.querySelector("[data-action='complete-recording-editor']");
    const canComplete = recordingEditor.mode === "photo-caption" || Boolean(recordingEditor.draft.trim());
    if (completeButton) completeButton.disabled = !canComplete;
  }
  if (event.target.id === "registerEmail" || event.target.id === "registerPassword") {
    registerEmail = document.getElementById("registerEmail")?.value || "";
    registerPassword = document.getElementById("registerPassword")?.value || "";
    if (registerNoticeTone === "error") {
      registerNotice = "";
      registerNoticeTone = "";
      document.querySelector(".auth-screen .auth-notice")?.remove();
    }
    const button = document.querySelector("[data-action='submit-register']");
    const canContinue = Boolean(registerEmail.trim() && registerPassword);
    if (button) {
      button.disabled = !canContinue;
      button.classList.toggle("disabled", !canContinue);
    }
  }
  if (event.target.matches(".register-code-digit")) {
    event.target.value = event.target.value.replace(/\D/g, "").slice(-1);
    const inputs = [...document.querySelectorAll(".register-code-digit")];
    registerCode = inputs.map((input) => input.value).join("");
    if (registerCodeNoticeTone === "error") {
      registerCodeNotice = "";
      registerCodeNoticeTone = "";
      document.querySelector(".auth-screen .auth-notice")?.remove();
    }
    if (event.target.value) inputs[Number(event.target.dataset.codeIndex) + 1]?.focus();
    const button = document.querySelector("[data-action='confirm-register-code']");
    if (button) {
      button.disabled = registerCode.length !== 6;
      button.classList.toggle("disabled", registerCode.length !== 6);
    }
  }
  if (event.target.id === "codeLoginEmail") {
    const nextEmail = event.target.value;
    if (nextEmail !== codeLoginEmail && codeLoginCodeSent) {
      codeLoginCodeSent = false;
      codeLoginCode = "";
      const codeInput = document.getElementById("codeLoginCode");
      if (codeInput) codeInput.value = "";
    }
    codeLoginEmail = nextEmail;
    codeLoginNotice = "";
    codeLoginNoticeTone = "";
    document.querySelector(".auth-screen .auth-notice")?.remove();
    const button = document.querySelector("[data-action='login-with-code']");
    if (button) {
      button.disabled = true;
      button.classList.add("disabled");
    }
  }
  if (event.target.id === "codeLoginCode") {
    codeLoginCode = event.target.value.replace(/\D/g, "").slice(0, 6);
    event.target.value = codeLoginCode;
    if (codeLoginNoticeTone === "error") {
      codeLoginNotice = "";
      codeLoginNoticeTone = "";
      document.querySelector(".auth-screen .auth-notice")?.remove();
    }
    const button = document.querySelector("[data-action='login-with-code']");
    const canLogin = codeLoginCodeSent && codeLoginCode.length === 6;
    if (button) {
      button.disabled = !canLogin;
      button.classList.toggle("disabled", !canLogin);
    }
  }
  if (["changePasswordCurrent", "changePasswordNew", "changePasswordConfirm"].includes(event.target.id)) {
    changePasswordCurrent = document.getElementById("changePasswordCurrent")?.value || "";
    changePasswordNew = document.getElementById("changePasswordNew")?.value || "";
    changePasswordConfirm = document.getElementById("changePasswordConfirm")?.value || "";
    if (changePasswordNoticeTone === "error") {
      changePasswordNotice = "";
      changePasswordNoticeTone = "";
      document.querySelector(".change-password-page .auth-notice")?.remove();
    }
    const button = document.querySelector("[data-action='submit-change-password']");
    const canSubmit = Boolean(changePasswordCurrent && changePasswordNew && changePasswordConfirm);
    if (button) {
      button.disabled = !canSubmit;
      button.classList.toggle("disabled", !canSubmit);
    }
  }
  if (event.target.id === "loginEmail" || event.target.id === "loginPassword") {
    loginEmail = document.getElementById("loginEmail")?.value || "";
    loginPassword = document.getElementById("loginPassword")?.value || "";
    if (loginNoticeTone === "error") {
      loginNotice = "";
      loginNoticeTone = "";
      document.querySelector(".auth-notice")?.remove();
    }
    const button = document.querySelector("[data-action='login-with-password']");
    const canLogin = Boolean(loginEmail.trim() && loginPassword);
    if (button) {
      button.disabled = !canLogin;
      button.classList.toggle("disabled", !canLogin);
    }
  }
  if (event.target.id === "resetPasswordEmail" || event.target.id === "resetPasswordValue") {
    resetPasswordEmail = document.getElementById("resetPasswordEmail")?.value || "";
    resetPasswordValue = document.getElementById("resetPasswordValue")?.value || "";
    if (resetPasswordNoticeTone === "error") {
      resetPasswordNotice = "";
      resetPasswordNoticeTone = "";
      document.querySelector(".auth-screen .auth-notice")?.remove();
    }
    const button = document.querySelector("[data-action='submit-reset-password']");
    const canContinue = Boolean(resetPasswordEmail.trim() && resetPasswordValue);
    if (button) {
      button.disabled = !canContinue;
      button.classList.toggle("disabled", !canContinue);
    }
  }
  if (event.target.matches(".reset-code-digit")) {
    clearResetPasswordCodeError();
    event.target.value = event.target.value.replace(/\D/g, "").slice(-1);
    const inputs = [...document.querySelectorAll(".reset-code-digit")];
    resetPasswordCode = inputs.map((input) => input.value).join("");
    if (event.target.value) inputs[Number(event.target.dataset.codeIndex) + 1]?.focus();
    const button = document.querySelector("[data-action='confirm-reset-password']");
    const canConfirm = resetPasswordCodeSent && Boolean(resetPasswordValue) && resetPasswordCode.length === 6;
    if (button) {
      button.disabled = !canConfirm;
      button.classList.toggle("disabled", !canConfirm);
    }
  }
  if (event.target.id === "deletePassword") {
    deleteAccountPassword = event.target.value;
    deleteAccountConfirmNotice = "";
    deleteAccountConfirmNoticeTone = "";
  }
  if (event.target.id === "deleteCode") {
    deleteAccountCode = event.target.value.replace(/\D/g, "").slice(0, 6);
    event.target.value = deleteAccountCode;
    deleteAccountConfirmNotice = "";
    deleteAccountConfirmNoticeTone = "";
  }
  if (event.target.id === "deletePassword" || event.target.id === "deleteCode") {
    const canDelete = deleteAccountConfirmMode === "password"
      ? deleteAccountPassword.trim().length > 0
      : deleteAccountCodeSent && deleteAccountCode.length === 6;
    const button = document.querySelector("[data-action='confirm-delete-account']");
    if (button) button.disabled = !canDelete;
  }
});

document.addEventListener("focusout", (event) => {
  if (event.target.id === "fileDetailMarkerInput" && fileDetailMarkerEditor) {
    persistFileDetailMarkerEdit();
    window.setTimeout(() => {
      if (["APP-FILE-01", "APP-FILE-10", "APP-FILE-15"].includes(currentPageId) && !fileDetailMarkerEditor) render();
    }, 0);
    return;
  }
  if (event.target.id === "fileDetailContentInput" && fileDetailContentEditor) {
    if (fileDetailDockInteraction || event.relatedTarget?.closest?.(".file-detail-edit-dock")) return;
    persistFileDetailContentEdit();
    window.setTimeout(() => {
      if (["APP-FILE-01", "APP-FILE-10", "APP-FILE-15"].includes(currentPageId) && !fileDetailContentEditor) render();
    }, 0);
  }
});

document.addEventListener("keydown", (event) => {
  if (!event.target.matches(".reset-code-digit, .register-code-digit") || event.key !== "Backspace" || event.target.value) return;
  const index = Number(event.target.dataset.codeIndex);
  const selector = event.target.matches(".register-code-digit") ? ".register-code-digit" : ".reset-code-digit";
  document.querySelector(`${selector}[data-code-index='${index - 1}']`)?.focus();
});

document.addEventListener("paste", (event) => {
  if (!event.target.matches(".reset-code-digit, .register-code-digit")) return;
  const pastedCode = event.clipboardData?.getData("text").replace(/\D/g, "").slice(0, 6) || "";
  if (!pastedCode) return;
  event.preventDefault();
  const isRegisterCode = event.target.matches(".register-code-digit");
  if (!isRegisterCode) clearResetPasswordCodeError();
  const selector = isRegisterCode ? ".register-code-digit" : ".reset-code-digit";
  const inputs = [...document.querySelectorAll(selector)];
  inputs.forEach((input, index) => {
    input.value = pastedCode[index] || "";
  });
  if (isRegisterCode) {
    registerCode = pastedCode;
    registerCodeNotice = "";
    registerCodeNoticeTone = "";
  } else {
    resetPasswordCode = pastedCode;
  }
  inputs[Math.min(pastedCode.length, 5)]?.focus();
  const button = document.querySelector(isRegisterCode ? "[data-action='confirm-register-code']" : "[data-action='confirm-reset-password']");
  if (button) {
    const canConfirm = isRegisterCode
      ? pastedCode.length === 6
      : resetPasswordCodeSent && Boolean(resetPasswordValue) && pastedCode.length === 6;
    button.disabled = !canConfirm;
    button.classList.toggle("disabled", !canConfirm);
  }
});

document.addEventListener("submit", (event) => {
  const filterFolderForm = event.target.closest("[data-action='save-filter-folder']");
  if (filterFolderForm) {
    event.preventDefault();
    const name = filterFolderForm.querySelector("#filterFolderName")?.value.trim();
    if (!name) {
      filterFolderError = "请输入文件夹名称";
      render();
      return;
    }
    const duplicate = filterFolders.some((folder) => folder.name === name && folder.id !== activeFilterFolderId);
    if (duplicate) {
      filterFolderError = "已存在同名文件夹";
      render();
      return;
    }
    if (filterFolderSheetMode === "rename" && activeFilterFolderId) {
      filterFolders = filterFolders.map((folder) => folder.id === activeFilterFolderId ? { ...folder, name } : folder);
    } else {
      filterFolders = [
        ...filterFolders,
        { id: `filter-folder-${Date.now()}`, name, count: 0, tone: filterFolders.length % 2 ? "blue" : "" }
      ];
    }
    filterFolderSheetMode = "";
    activeFilterFolderId = "";
    pendingDeleteFilterFolderId = "";
    filterFolderError = "";
    render();
    return;
  }
  const folderForm = event.target.closest("[data-action='save-new-folder']");
  if (folderForm) {
    event.preventDefault();
    const name = folderForm.querySelector("#newFolderName")?.value.trim();
    if (!name) return;
    const folder = {
      id: `custom-${Date.now()}`,
      name,
      count: 0,
      tone: moveFolderFolders.length % 2 ? "blue" : ""
    };
    moveFolderFolders = [...moveFolderFolders, folder];
    selectedMoveFolderId = folder.id;
    moveFolderCreateOpen = false;
    render();
    return;
  }
  const form = event.target.closest("[data-action='ask-submit']");
  if (!form) return;
  event.preventDefault();
  if (askPlaudMode === "thinking") {
    askPlaudMode = "answer";
  } else {
    askPlaudPrompt = form.querySelector("#askPlaudInput")?.value.trim() || askPlaudPrompt || askPlaudSuggestions[0];
    askPlaudMode = "thinking";
  }
  render();
});

if (currentPageId === "APP-DEV-08") {
  beginFirmwareUpdateFlow();
}

try {
  render();
} catch (error) {
  const target = document.getElementById("phone");
  if (target) {
    target.innerHTML = `<div style="padding:24px;font-family:sans-serif"><h2>原型渲染错误</h2><p>${h(error.message)}</p></div>`;
  }
  const spec = document.getElementById("specBody");
  if (spec) {
    spec.innerHTML = `<pre style="white-space:pre-wrap;color:#b13b2d">${h(error.stack || error.message)}</pre>`;
  }
  throw error;
}
